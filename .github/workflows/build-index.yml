name: build-index

# As actions estão presas ao commit exacto, não a uma tag: uma tag pode ser
# reapontada por quem controla a action, e o build-index corre com a chave de
# assinatura do catálogo. O Dependabot sobe estes pins.

# Re-resolves every app's newest release, downloads the APKs, hashes them, reads
# the signing certificates, re-hosts icons/screenshots, signs the result and
# commits it. A nightly run is what keeps "update available" honest without any
# backend doing it on demand.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: "Quantos releases candidatos inspecionar por app"
        default: "3"
        required: false

concurrency:
  group: build-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # aapt2 and apksigner come from the Android SDK; the JDK is needed because
      # apksigner is a wrapper around `java -jar`.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: build-tools do Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --install "build-tools;36.0.0" "platforms;android-36" > /dev/null
          "$SDKMANAGER" --list_installed | grep -E "build-tools;36" || true

      - run: pnpm install --frozen-lockfile

      # Sem a chave privada não há índice assinado, e sem isto o job falharia mais
      # tarde com um erro de criptografia em vez de dizer o que falta.
      - name: verificar o secret da chave de assinatura
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          if [ -z "${INDEX_SIGNING_KEY}" ]; then
            cat <<'MSG'
          ::error::Falta o secret INDEX_SIGNING_KEY neste repositório.
          Cria-o uma vez com:
            gh secret set INDEX_SIGNING_KEY --repo ${{ github.repository }} < keys/index-signing.key.pem
          Guarda também uma cópia offline da chave: se a perderes, os clientes já
          instalados deixam de aceitar índices novos até sair uma versão com outra chave.
          MSG
            exit 1
          fi

      # Depois da guarda (que diz o que fazer quando falta) e antes de descarregar
      # 1,3 GB de APKs: assinar com a chave errada produz um índice que todas as apps
      # instaladas recusam, e é melhor descobri-lo em dois segundos.
      - name: a chave do secret é a que a app conhece
        run: node tools/keys.mjs check
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}

      - name: construir o índice
        run: pnpm run build --deep ${{ github.event.inputs.deep || '3' }} --jobs 4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: assinar
        run: pnpm run sign
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}

      - name: verificar a assinatura como um cliente faria
        run: pnpm run verify

      - name: validar schema e regras cruzadas
        run: pnpm run validate

      - name: taxa de sucesso (informativo)
        run: echo "apps indexadas" && node -e "console.log(JSON.parse(require('fs').readFileSync('index.json','utf8')).apps.length)"

      - name: guardar o índice para auditoria
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index-${{ github.run_number }}
          path: |
            index.json
            index.json.sig
          retention-days: 90

      - name: commit
        run: |
          git config user.name "montra-bot"
          git config user.email "montra-bot@users.noreply.github.com"
          git add index.json index.json.sig apps icons screenshots
          if git diff --cached --quiet; then
            echo "nada mudou"
            exit 0
          fi
          git commit -m "chore(index): reconstruir $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
