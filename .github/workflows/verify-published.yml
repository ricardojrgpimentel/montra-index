name: verify-published

# As actions estão presas ao commit exacto, não a uma tag: uma tag pode ser
# reapontada por quem controla a action, e o build-index corre com a chave de
# assinatura do catálogo. O Dependabot sobe estes pins.

# The index is built from upstream releases that we do not control. This job goes
# back over everything we published and re-downloads it: if a release asset has
# been replaced with different bytes since we indexed it, or an APK now carries a
# different signing certificate, that is exactly the supply-chain event the
# catalogue exists to catch. Weekly, because it moves 1.3 GB.
on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehash:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: build-tools do Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --install "build-tools;36.0.0" "platforms;android-36" > /dev/null
          "$SDKMANAGER" --list_installed | grep -E "build-tools;36" || true
      - run: pnpm install --frozen-lockfile

      - name: assinatura do índice publicado
        run: pnpm run verify

      - name: descarregar tudo outra vez e comparar hashes e certificados
        run: pnpm run verify --all --rehash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
