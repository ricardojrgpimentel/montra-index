name: verify-published

# The index is built from upstream releases that we do not control. This job goes
# back over everything we published and re-downloads it: if a release asset has
# been replaced with different bytes since we indexed it, or an APK now carries a
# different signing certificate, that is exactly the supply-chain event the
# catalogue exists to catch. Weekly, because it moves 1.3 GB.
on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehash:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "build-tools;35.0.0" > /dev/null
      - run: pnpm install --frozen-lockfile

      - name: assinatura do índice publicado
        run: pnpm run verify

      - name: descarregar tudo outra vez e comparar hashes e certificados
        run: pnpm run verify --all --rehash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
