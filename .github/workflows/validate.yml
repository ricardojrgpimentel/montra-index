name: validate

# As actions estão presas ao commit exacto, não a uma tag: uma tag pode ser
# reapontada por quem controla a action, e o build-index corre com a chave de
# assinatura do catálogo. O Dependabot sobe estes pins.

# Runs on every pull request that touches the catalogue. Nothing here downloads
# APKs: it validates schema, cross-entry rules, and that every app's release
# config still resolves to a real asset. Fast enough to be a required check.
on:
  pull_request:
    paths:
      - "apps/**"
      - "schema/**"
      - "tools/**"
      - "index.json"
      - "package.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "schema/**"
      - "tools/**"
      - "index.json"
      # uma alteração ao próprio CI tem de correr o CI
      - ".github/workflows/**"
  # e uma alteração a este ficheiro tem de poder ser testada sem um commit falso
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: schema + cross-entry rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: testes das ferramentas
        run: pnpm test

      - name: validar entradas
        run: pnpm run validate

      # hashFiles() não é aceite numa condição de job (rejeita o workflow
      # inteiro); num passo funciona, e é aqui que já há checkout.
      - name: verificar a assinatura do índice publicado
        if: hashFiles('index.json.sig') != ''
        run: pnpm run verify

  releases:
    name: releases resolvíveis
    runs-on: ubuntu-latest
    needs: schema
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: cada app resolve para um asset real
        # --deep 3: se o release mais recente mudou de nomes de assets, cai para
        # o anterior e avisa, em vez de partir o CI por causa de uma renomeação
        # a montante. Um padrão que não resolva nada continua a falhar.
        run: pnpm run build --dry --deep 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
